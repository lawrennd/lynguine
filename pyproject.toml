[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lynguine"
version = "0.1.2"
description = "Package for lynguine data oriented architecture interfaces."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Neil D. Lawrence", email = "lawrennd@gmail.com" },
]
requires-python = ">=3.11.5,<4.0"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "python-frontmatter",
    # 2.x removes bibdatabase / dump used by lynguine.access.io and tests.
    "bibtexparser>=1.4.3,<2",
    "pyyaml",
    "openpyxl",
    "XlsxWriter",
    # Stay on pandas 2.x (Poetry lock was 2.3.0); 3.x changes StringDtype/NA behaviour.
    "pandas>=2.3.0,<3",
    "numpy>=2.0.0",
    "pypandoc",
    "gitpython>=3.1.62",
    "anyascii",
    "python-liquid",
    "pylatexenc",
    "markdown",
    "markdownify",
    "google-api-python-client",
    "google-auth-httplib2",
    "gspread-pandas",
    "mimesis>11",
    "wget",
    # 26+ ships cp313 wheels; 25.1.2 falls back to a source build that fails on
    # current manylinux (strlcpy conflict in bundled libzmq).
    "pyzmq>=26.0.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
# CIP-0013 document readers. Install: pip install 'lynguine[documents]'
# or: uv sync --extra documents
documents = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]
# CIP-0015 phase 2 binary tables. Install: pip install 'lynguine[parquet]'
# or: uv sync --extra parquet
parquet = [
    # pyarrow 19+ (26 current) requires NumPy 2.0.
    "pyarrow>=19.0.0,<27",
]

[project.urls]
Homepage = "https://github.com/lawrennd/lynguine"

[project.scripts]
ndlconvert = "lynguine.ndlconvert:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<7",
    "pytest-mock>=3.14.0,<4",
    "deepdiff>=8.6.2,<9",
    "ruff>=0.17.0,<0.18",
]
docs = [
    "sphinx>=7.2.6,<8",
    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=2.0.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["lynguine"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Minimal Ruff baseline (backlog: 2026-10-11_introduce-ruff-minimal-lint).
# Stage 1 installs the tool and wires CI without a mass cleanup.
# Baseline on lynguine/ (~2026-10-11): hundreds of E/F findings if enabled,
# ~75 files would be reformatted; enable rules/format gates in follow-ups.
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["lynguine"]

[tool.ruff.lint]
# Intentionally empty until a follow-up enables E4/E7/E9/F (or similar)
# after the existing findings are addressed or ignored deliberately.
select = []

[tool.ruff.format]
quote-style = "double"
