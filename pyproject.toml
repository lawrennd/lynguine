[tool.poetry]
name = "lynguine"
version = "0.1.2"
description = "Package for lynguine data oriented architecture interfaces."
authors = ["Neil D. Lawrence <lawrennd@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/lawrennd/lynguine"
include = ["lynguine/defaults.yml"]
classifiers = [
    "License :: OSI Approved :: MIT License",	
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: PyPy"
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
python-frontmatter = "*"
bibtexparser = "*"
pyyaml = "*"
openpyxl = "*"
XlsxWriter = "*"
pandas = "*"
numpy = ">=1.0.0,<2.0.0" # to deal with this https://github.com/explosion/thinc/issues/939
pypandoc = "*"
gitpython = ">=3.1.62"
anyascii = "*"
python-liquid = "*"
pylatexenc = "*"
markdown = "*"
markdownify = "*"
google-api-python-client = "*"
google-auth-httplib2 = "*"
gspread-pandas = "*"
mimesis = ">11"
wget = "*"
pyzmq = "^25.1.2"
cryptography = ">=50.0.0"
pymupdf = {version = ">=1.24.0", optional = true}
python-docx = {version = ">=1.1.0", optional = true}

[tool.poetry.extras]
# CIP-0013 document readers. Install: poetry install --extras documents
documents = ["pymupdf", "python-docx"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
deepdiff = "^8.6.2"
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
toml = "^0.10.2"
myst-parser = "^2.0.0"

# The docs group provides dependencies for building documentation
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
myst-parser = "^2.0.0"
toml = "^0.10.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.0"

[tool.poetry.scripts]
ndlconvert = "lynguine.ndlconvert:main"

# pyproject.toml
[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Minimal Ruff baseline (backlog: 2026-10-11_introduce-ruff-minimal-lint).
# Stage 1 installs the tool and wires CI without a mass cleanup.
# Baseline on lynguine/ (~2026-10-11): hundreds of E/F findings if enabled,
# ~75 files would be reformatted; enable rules/format gates in follow-ups.
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["lynguine"]

[tool.ruff.lint]
# Intentionally empty until a follow-up enables E4/E7/E9/F (or similar)
# after the existing findings are addressed or ignored deliberately.
select = []

[tool.ruff.format]
quote-style = "double"

