id: pmlr_twocolumn_v1
family: pmlr_paper
builder: make_pmlr_twocolumn
notes: >
  Inspired by PMLR / mlresearch volume PDFs (two-column body, References
  with author–year entries). Synthetic content only.
expected:
  text_layer: present
  min_pages: 2
  min_total_words: 200
  contains:
    - References
  twocolumn_body: true
  min_reference_lines: 3
  # Gold for pmlr_references.v1 (substring match per entry)
  ref_raw_contains:
    - "Ahmed and Aaron Courville"
    - "Brain of the Firm"
    - "Every good regulator"
    - "Deep learning"
