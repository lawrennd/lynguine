name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        pip install poetry
    - name: Install dependencies
      run: |
        # documents extra: PyMuPDF for CIP-0013 PDF reader tests
        # parquet extra: pyarrow for CIP-0015 phase 2 store tests
        poetry install --extras "documents parquet"
    - name: Lint with Ruff
      run: |
        # Stage 1: prove Ruff is installed and configured. Rule select is
        # empty in pyproject.toml until a follow-up enables a green subset.
        poetry run ruff check lynguine
    - name: Run tests with pytest and coverage
      run: |
        poetry run pytest --cov=lynguine --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        # Do not fail the build when Codecov rejects the upload (e.g. missing
        # token on Dependabot PRs / protected-branch rules). Tests remain the gate.
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
