name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # documents extra: PyMuPDF for CIP-0013 PDF reader tests
        # parquet extra: pyarrow for CIP-0015 phase 2 store tests
        uv sync --extra documents --extra parquet --group dev
    - name: Lint with Ruff
      run: |
        # Stage 1: prove Ruff is installed and configured. Rule select is
        # empty in pyproject.toml until a follow-up enables a green subset.
        uv run ruff check lynguine
    - name: Run tests with pytest and coverage
      run: |
        uv run pytest --cov=lynguine --cov-report=xml
    - name: Upload coverage to Codecov
      # One upload keeps the PR patch report stable across the matrix.
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        # Do not fail the build when Codecov rejects the upload (e.g. missing
        # token on Dependabot PRs / protected-branch rules). Tests remain the gate.
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
